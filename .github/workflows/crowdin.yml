name: Crowdin Sync

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crowdin Action
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          download_translations: true
          # Pull translations and create a PR if there are changes
          create_pull_request: true
          pull_request_title: "chore: update translations from Crowdin"
          pull_request_body: "New translations have been downloaded from Crowdin."
          pull_request_branch: "crowdin-translations"
          pull_request_base: "main"
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
